name: links

# Links and the projects' own data can change without any change here (a renamed
# repository, a re-run notebook, a new CSV), so besides pull requests that touch the
# pages or the numbers this also runs every Monday.
on:
  pull_request:
    paths:
      - README.md
      - README.pt-BR.md
      - assets/SOURCES.md
      - scripts/check_links.py
      - scripts/check_numbers.py
      - scripts/cards.py
      - scripts/build_assets.py
      - scripts/data/**
      - .github/workflows/links.yml
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: README links answer
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Check links
        run: python scripts/check_links.py

  numbers:
    name: README numbers match their sources
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      # check_numbers imports the build's copy (STR, cards.C), which needs the build's packages.
      - run: pip install -r scripts/requirements.txt
      - name: Check numbers
        run: python scripts/check_numbers.py
