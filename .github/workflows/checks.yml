name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  assets:
    name: tests and reproducible assets
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Tests
        run: python -m unittest discover -s scripts -v
      - name: Build assets
        run: python scripts/build_assets.py
      - name: Committed assets match the code
        run: |
          changed=$(git status --porcelain)
          if [ -n "$changed" ]; then
            echo "::error::The build changed committed files. Run python scripts/build_assets.py and commit the result."
            echo "$changed"
            git diff --stat
            exit 1
          fi

  attribution:
    name: no AI attribution
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Commits, branch, title, description and files
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          markers='co-authored-by:.*(claude|anthropic|copilot|openai|chatgpt|gemini|cursor|codex|devin)|claude-session:|generated with \[?(claude|copilot|chatgpt|cursor|codex|gemini)|built with compound engineering|🤖'
          failed=0
          for sha in $(git rev-list "$BASE..$HEAD"); do
            if git log -1 --format=%B "$sha" | grep -qiE "$markers"; then
              echo "::error::Commit $(git log -1 --format='%h %s' "$sha") carries an AI attribution line."
              failed=1
            fi
          done
          if printf '%s' "$BRANCH" | grep -qiE 'claude|copilot|codex|chatgpt|gemini'; then
            echo "::error::Branch name '$BRANCH' names an AI tool."
            failed=1
          fi
          if printf '%s\n%s' "$TITLE" "$BODY" | grep -qiE "$markers"; then
            echo "::error::The pull request title or description carries an AI attribution line."
            failed=1
          fi
          if git ls-tree -r --name-only "$HEAD" | grep -qiE '(^|/)claude\.md$'; then
            echo "::error::CLAUDE.md is local only and must not be committed."
            failed=1
          fi
          exit $failed
